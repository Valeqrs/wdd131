<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore LDS temples with interactive filters. View temple names, locations, dedication dates, and areas. Filter by Old, New, Large, and Small temples.">
    <meta name="author" content="Valeria Quintero">
    <title>LDS Temple Album - Filtered</title>
    <link rel="stylesheet" href="styles/filtered-temples.css">
</head>
<body>
    <header>
        <h1>Temple Album</h1>
        <nav>
            <ul>
                <li><a href="#" data-filter="home">Home</a></li>
                <li><a href="#" data-filter="old">Old</a></li>
                <li><a href="#" data-filter="new">New</a></li>
                <li><a href="#" data-filter="large">Large</a></li>
                <li><a href="#" data-filter="small">Small</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div id="temple-cards-container"></div>
    </main>

    <footer>
        <p>&copy; <span id="year"></span> | Last modified: <span id="lastModified"></span></p>
    </footer>

    <script src="scripts/filtered-temples.js" defer></script>
</body>
</html>
